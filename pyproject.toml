[project]
name = "audio-player"
version = "0.2.7"
description = "Компактный локальный аудиоплеер со звуковой волной"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "PySide6-Essentials==6.12.0", "PySide6-Addons==6.12.0", "mutagen==1.48.1",
    "numpy==2.5.4", "av==19.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
